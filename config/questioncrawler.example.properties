# QuestionCrawler configuration. Relative paths are resolved against this file's directory.
# NEVER put tokens or passwords in this file. Use an environment variable and name it below.

# ---- Storage -------------------------------------------------------------------------------
# Where collected internal content lives. Use an organization-approved location OUTSIDE the
# source-code repository. Everything here is plain files (no database).
storage.root=~/.questioncrawler/data

# Optional: your own taxonomy file (JSON). Empty = bundled starter taxonomy.
taxonomy.file=taxonomy.json

# ---- Source --------------------------------------------------------------------------------
# fixture       = offline synthetic demo data (works with no credentials or network)
# stackexchange = public Stack Exchange API
# confluence    = Confluence Cloud or Server/DC (see docs/CONFLUENCE.md); separate from Jive/SharePoint
# jive          = Jive community via Core REST v3 (see docs/JIVE.md); separate from Confluence/SharePoint
# sharepoint    = SharePoint Online via Microsoft Graph (see docs/SHAREPOINT.md); separate from Confluence/Jive
# live          = internal Stack Exchange–style Q&A site (see docs/LIVE_INTEGRATION.md)
source.type=fixture

# Fixture settings (source.type=fixture). Empty dirs = the demo site bundled in the jar.
source.fixture.dirs=
source.fixture.pageSize=2

# Live settings (source.type=live)
source.systemId=internal-qa
source.baseUrl=
# Only these hosts / path prefixes are ever contacted. Redirects are not followed.
source.allowedHosts=
source.allowedPathPrefixes=/
# Plain http is refused unless this is true (local testing only).
source.allowInsecureHttp=false
# none | token. For token auth, the token is read from the NAMED environment variable.
source.auth.method=none
source.auth.tokenEnv=INTERNAL_QA_TOKEN
source.auth.headerName=Authorization
source.auth.scheme=Bearer
# Optional PEM file with your organization's CA certificate (added to, not replacing, the default trust).
source.caCertFile=
source.timeoutSeconds=30

# ---- Synchronization -----------------------------------------------------------------------
# Target tags (comma separated). Exact, case-insensitive matching unless partialTags=true.
sync.tags=orbit
# ANY = at least one tag, ALL = every tag
sync.tagMode=ANY
sync.partialTags=false
# Incremental sync re-reads this much history before the checkpoint (clock skew, late edits).
sync.overlapMinutes=60
sync.concurrency=4
sync.maxAttempts=5
# Deleted / inaccessible content is hidden from search immediately and purged after this many days.
sync.retentionDays=30
# Optional built-in scheduler, used only by the web application. Off by default.
sync.scheduler.enabled=false
sync.scheduler.intervalMinutes=360

# ---- Status --------------------------------------------------------------------------------
# The store is reported as stale when the last successful sync is older than this.
status.staleAfterHours=168
