# Test configuration: public Stack Overflow, tag "Artificial Intelligence" (its slug is artificial-intelligence).
# Use with:  scripts/qc.sh --config config/stackoverflow-test.properties <command>
# No credentials needed (anonymous quota is about 300 API requests/day). For a larger quota, register an
# application key at https://stackapps.com and put it in the ENVIRONMENT variable named below, never in this file.

storage.root=~/.questioncrawler/stackoverflow-test
taxonomy.file=

source.type=stackexchange
source.siteUrl=https://stackoverflow.com/
source.stackexchange.apiBaseUrl=https://api.stackexchange.com/2.3
source.stackexchange.keyEnv=STACKEXCHANGE_KEY
source.timeoutSeconds=30

# "Artificial Intelligence" and "artificial-intelligence" are treated as the same tag.
sync.tags=Artificial Intelligence
sync.tagMode=ANY
sync.partialTags=false

# Collect only questions created in the last 30 days: keeps the first run small and inside the anonymous quota.
# Remove this line (or pass a larger window) to collect more, ideally with an application key.
sync.maxQuestionAge=30d

sync.overlapMinutes=60
sync.concurrency=2
sync.maxAttempts=5
sync.retentionDays=30
status.staleAfterHours=168
