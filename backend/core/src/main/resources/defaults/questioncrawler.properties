# QuestionCrawler configuration. Relative paths are resolved against this file's directory.
# NEVER put tokens or passwords in this file. Use an environment variable and name it below.

# ---- Storage -------------------------------------------------------------------------------
# Where collected internal content lives. Use an organization-approved location OUTSIDE the
# source-code repository. Everything here is plain files (no database).
storage.root=@STORAGE_ROOT@

# Optional: your own taxonomy file (JSON). Empty = bundled starter taxonomy.
taxonomy.file=taxonomy.json

# ---- Source --------------------------------------------------------------------------------
# fixture       = offline synthetic demo data (works with no credentials or network)
# stackexchange = public Stack Exchange API (stackoverflow.com and other public sites), documented API
# confluence    = Confluence Cloud or Server/DC via classic Content REST API + CQL (separate source)
# jive          = Jive community via Core REST API v3 (separate source; see docs/JIVE.md)
# sharepoint    = SharePoint Online via Microsoft Graph (separate source; see docs/SHAREPOINT.md)
# live          = YOUR internal Stack Exchange–style Q&A site (see docs/LIVE_INTEGRATION.md)
# Keep confluence / jive / sharepoint / stackoverflow keys separate — never reuse across source types.
source.type=fixture

# Stack Exchange settings (source.type=stackexchange)
source.siteUrl=https://stackoverflow.com/
# Optional overrides: source.stackexchange.site=stackoverflow
source.stackexchange.apiBaseUrl=https://api.stackexchange.com/2.3
# Optional: NAME of an environment variable holding a Stack Exchange application key (raises the daily
# request quota from about 300 to 10,000). The key itself never goes in this file.
source.stackexchange.keyEnv=STACKEXCHANGE_KEY

# Fixture settings (source.type=fixture). Empty dirs = the demo site bundled in the jar.
source.fixture.dirs=
source.fixture.pageSize=2

# Confluence settings (source.type=confluence) — see docs/CONFLUENCE.md
# source.systemId=confluence
# source.baseUrl=https://acme.atlassian.net
# source.confluence.edition=cloud
# source.confluence.email=you@example.com
# source.confluence.emailEnv=
# source.confluence.spaces=ENG
# source.confluence.ancestorPageId=
# source.confluence.contentTypes=page
# source.confluence.apiRoot=
# source.confluence.bodyExpand=body.storage
# source.confluence.collectComments=false
# source.confluence.pageSize=25
# source.confluence.includeSpaceTag=true
# source.auth.method=basic-env
# source.auth.tokenEnv=CONFLUENCE_API_TOKEN
# source.allowedHosts=acme.atlassian.net
# source.allowedPathPrefixes=/wiki/rest/api/
# source.followRedirects=same-host
# For Server/DC: source.confluence.edition=server, source.auth.method=token, source.auth.tokenEnv=CONFLUENCE_PAT,
# source.allowedPathPrefixes=/rest/api/

# Jive settings (source.type=jive) — see docs/JIVE.md
# source.systemId=jive
# source.baseUrl=https://community.example.com
# source.jive.username=svc-questioncrawler
# source.jive.usernameEnv=
# source.jive.places=1006
# source.jive.contentTypes=document,discussion,question
# source.jive.apiRoot=
# source.jive.collectComments=false
# source.jive.pageSize=25
# source.jive.includePlaceTag=true
# source.auth.method=basic-env
# source.auth.tokenEnv=JIVE_PASSWORD
# source.allowedHosts=community.example.com
# source.allowedPathPrefixes=/api/core/v3/
# source.followRedirects=same-host
# For OAuth Bearer: source.auth.method=token, source.auth.tokenEnv=JIVE_ACCESS_TOKEN

# SharePoint settings (source.type=sharepoint) — see docs/SHAREPOINT.md
# source.systemId=sharepoint
# source.baseUrl=https://contoso.sharepoint.com/sites/Engineering
# source.sharepoint.tenantId=
# source.sharepoint.clientId=
# source.sharepoint.clientSecretEnv=SHAREPOINT_CLIENT_SECRET
# source.sharepoint.siteId=
# source.sharepoint.listIds=
# source.sharepoint.contentMode=pages
# source.sharepoint.graphBaseUrl=https://graph.microsoft.com/v1.0
# source.sharepoint.collectComments=false
# source.sharepoint.pageSize=25
# source.sharepoint.includeSiteTag=true
# source.auth.method=token
# source.auth.tokenEnv=SHAREPOINT_ACCESS_TOKEN
# source.allowedHosts=contoso.sharepoint.com,graph.microsoft.com
# source.allowedPathPrefixes=/v1.0/
# source.followRedirects=same-host
# Prefer Azure AD client credentials: set tenantId + clientId + clientSecretEnv (Bearer is minted for Graph).
# Or supply a pre-minted Graph access token via SHAREPOINT_ACCESS_TOKEN.

# Live settings (source.type=live)
# source.systemId=internal-qa   (default: site name for stackexchange, confluence/jive/sharepoint for those types, internal-qa otherwise)
source.baseUrl=
# Only these hosts / path prefixes are ever contacted.
source.allowedHosts=
source.allowedPathPrefixes=/
# Plain http is refused unless this is true (local testing only).
source.allowInsecureHttp=false
# none | token | basic-env. Secrets are read from the NAMED environment variable only.
source.auth.method=none
source.auth.tokenEnv=INTERNAL_QA_TOKEN
source.auth.headerName=Authorization
source.auth.scheme=Bearer
# Optional PEM file with your organization's CA certificate (added to, not replacing, the default trust).
source.caCertFile=
# Company web proxy (leave empty if there is none). If the HTTPS_PROXY environment variable is set, that is used automatically.
network.proxyHost=
network.proxyPort=
# Hosts reached directly instead of through the proxy (comma separated). Local addresses always skip the proxy.
network.noProxy=
# Only if the proxy asks you to sign in: NAMES of environment variables holding the user and password (never the values).
network.proxyUserEnv=
network.proxyPasswordEnv=
source.timeoutSeconds=30
# Follow redirects: all | same-host | off (Confluence preset uses same-host)
source.followRedirects=all

# ---- Synchronization -----------------------------------------------------------------------
# Target tags (comma separated). Exact, case-insensitive matching unless partialTags=true.
sync.tags=orbit
# ANY = at least one tag, ALL = every tag
sync.tagMode=ANY
sync.partialTags=false
# Optional collection window: only collect questions created within this age (30d, 12h, 2w, 6m, 1y).
# Older questions are out of scope. Useful for large public sites and small request quotas.
sync.maxQuestionAge=

# Incremental sync re-reads this much history before the checkpoint (clock skew, late edits).
sync.overlapMinutes=60
sync.concurrency=4
sync.maxAttempts=5
# Deleted / inaccessible content is hidden from search immediately and purged after this many days.
sync.retentionDays=30
# Optional built-in scheduler, used only by the web application. Off by default.
sync.scheduler.enabled=false
sync.scheduler.intervalMinutes=360

# ---- Status --------------------------------------------------------------------------------
# The store is reported as stale when the last successful sync is older than this.
status.staleAfterHours=168
