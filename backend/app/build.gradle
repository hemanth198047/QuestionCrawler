plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// When the React app has been built (npm run build in frontend/), package it as static files so that one
// process serves both the API and the UI at http://localhost:8080. Nothing is copied if it was not built.
def frontendDist = file("${rootDir}/../frontend/dist")
tasks.named('processResources') {
    if (frontendDist.exists()) {
        from(frontendDist) { into 'static' }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
